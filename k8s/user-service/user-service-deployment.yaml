apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: it-helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: it-helpdesk-user-service:v2
          imagePullPolicy: Never

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          ports:
            - containerPort: 8001