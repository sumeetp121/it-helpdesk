name: IT Helpdesk CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-services:
    name: Validate Python Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install User Service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r user-service/requirements.txt

      - name: Install Notification Service dependencies
        run: |
          pip install -r notification-service/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile user-service/app.py
          python -m py_compile notification-service/app.py

  ticket-service:
    name: Build Ticket Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: ticket-service/go.sum

      - name: Download Go dependencies
        working-directory: ticket-service
        run: go mod download

      - name: Build Ticket Service
        working-directory: ticket-service
        run: go build -v .

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build User Service image
        run: |
          docker build \
            -f docker/user-service/Dockerfile \
            -t ghcr.io/sumeetp121/it-helpdesk-user-service:${{ github.sha }} .

      - name: Push User Service image
        run: |
          docker push \
            ghcr.io/sumeetp121/it-helpdesk-user-service:${{ github.sha }}

      - name: Build Notification Service image
        run: |
          docker build \
            -f docker/notification-service/Dockerfile \
            -t ghcr.io/sumeetp121/it-helpdesk-notification-service:${{ github.sha }} .

      - name: Push Notification Service image
        run: |
          docker push \
            ghcr.io/sumeetp121/it-helpdesk-notification-service:${{ github.sha }}

      - name: Build Ticket Service image
        run: |
          docker build \
            -f docker/ticket-service/Dockerfile \
            -t ghcr.io/sumeetp121/it-helpdesk-ticket-service:${{ github.sha }} .

      - name: Push Ticket Service image
        run: |
          docker push \
            ghcr.io/sumeetp121/it-helpdesk-ticket-service:${{ github.sha }}

      - name: Build Frontend image
        run: |
          docker build \
            -f docker/frontend/Dockerfile \
            -t ghcr.io/sumeetp121/it-helpdesk-frontend:${{ github.sha }} .

      - name: Push Frontend image
        run: |
          docker push \
            ghcr.io/sumeetp121/it-helpdesk-frontend:${{ github.sha }}

      # ----------------------------------------
      # Update GitOps desired state
      # ----------------------------------------

      - name: Update GitOps image tags
        run: |
          sed -i \
            "s/tag: \".*\"/tag: \"${{ github.sha }}\"/g" \
            gitops/it-helpdesk-values.yaml

      - name: Show updated GitOps values
        run: |
          cat gitops/it-helpdesk-values.yaml

      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/it-helpdesk-values.yaml

          git commit -m "Update GitOps image tags to ${{ github.sha }}" || echo "No changes to commit"

          git push